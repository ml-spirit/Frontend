<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HTML Форма</title>
</head>
<body>
    <h2>Лабораторна 5</h2>
    <h3>Завдання 1</h3>

    <form id="registrationForm">
        <script>
            function validateInput(id, pattern, error_message) {
                const input = document.getElementById(id);

                input.addEventListener("input", function() {
                    if (!pattern.test(input.value)) {
                        input.style.backgroundColor = "#ffcccc";
                        input.setCustomValidity(error_message);
                    } else {
                        input.style.backgroundColor = "lightgreen";
                        input.setCustomValidity("");
                    }
                });
            }
        </script>

        <label for="pib">ПІБ:</label>
        <input
            type="text"
            id="pib"
            name="pib"
            placeholder="ТТТТТТ Т. Т."
            required
        >
        <br><br>

        <!-- Group -->
        <label for="group">Група:</label>
        <input 
            type="text" 
            id="group" 
            name="group" 
            placeholder="ТТ-ЧЧ"
            required
        >
        <br><br>

        <!-- Phone -->
        <label for="phone">Телефон:</label>
        <input 
            type="text" 
            id="phone" 
            name="phone"
            placeholder="(ЧЧЧ)-ЧЧЧ-ЧЧ-ЧЧ"
            required
        >
        <br><br>

        <!-- Faculty -->
        <label for="faculty">Факультет:</label>
        <input 
            type="text" 
            id="faculty" 
            name="faculty"
            placeholder="ТТТТ"
            required
        >
        <br><br>

        <!-- Adress -->
        <label for="address">Адреса:</label>
        <input 
            type="text" 
            id="address" 
            name="address"
            placeholder="м. ЧЧЧЧЧЧ"
            required
        >
        <br><br>

        <script>
            validateInput(
                "pib",
                /^[А-ЯІЇЄҐа-яіїєґ'-]+ [А-ЯІЇЄҐ]\. [А-ЯІЇЄҐ]\.$/u,
                "Неправильний формат ПІБ"
            );

            validateInput(
                "group",
                /^[А-ЯІЇЄҐ]{2}-\d{2}$/,
                "Неправильний формат групи! Приклад: ІО-41"
            );

            validateInput(
                "phone",
                /^\(\d{3}\)-\d{3}-\d{2}-\d{2}$/,
                "Неправильний формат телефону! Приклад: (099)-123-45-67"
            );

            validateInput(
                "faculty",
                /^[А-ЯІЇЄҐа-яіїєґ]{4}$/,
                "Неправильний формат факультету! Приклад: ІПСА"
            );

            validateInput(
                "address",
                /^м\. \d{6}$/,
                "Неправильний формат адреси! Приклад: м. 123456"
            );
        </script>

        <!-- Кнопки -->
        <button type="submit">Відправити</button>
        <br><br>

        <div id="result" style="display: none;">
            <h2>Введені дані</h2>
            <p id="resultPib"></p>
            <p id="resultGroup"></p>
            <p id="resultPhone"></p>
            <p id="resultFaculty"></p>
            <p id="resultAddress"></p>
        </div>
        <br><br>

        <script>
            document.getElementById("registrationForm")
                .addEventListener("submit", function(event) 
                {
                    event.preventDefault();

                    if (!this.checkValidity()) 
                    {
                        this.reportValidity();
                        return;
                    }

                    document.getElementById("resultPib").innerHTML =
                        "<b>ПІБ:</b> " + document.getElementById("pib").value;

                    document.getElementById("resultGroup").innerHTML =
                        "<b>Група:</b> " + document.getElementById("group").value;

                    document.getElementById("resultPhone").innerHTML =
                        "<b>Телефон:</b> " + document.getElementById("phone").value;

                    document.getElementById("resultFaculty").innerHTML =
                        "<b>Факультет:</b> " + document.getElementById("faculty").value;

                    document.getElementById("resultAddress").innerHTML =
                        "<b>Адреса:</b> " + document.getElementById("address").value;

                    document.getElementById("result").style.display = "block";
                });
        </script>
    </form?>

    <br><br>
    
    <input type="color" id="colorPicker" value="#ff0000">
    <br><br>

    <style>
        td 
        {
            width: 50px;
            height: 50px;
            padding: 0;
            border: 1px solid black;
            box-sizing: border-box;
            text-align: center;
            vertical-align: middle;
        }
    </style>

    <script>
        const cell3 = document.getElementById("cell3");
        const colorPicker = document.getElementById("colorPicker");
        const table = document.getElementById("color_table");

        function randomColor() 
        {
            return "#" + Math.floor(Math.random() * 16777216)
                .toString(16)
                .padStart(6, "0");
        }

        cell3.addEventListener("mouseover", function() 
        {
            cell3.style.backgroundColor = randomColor();
        });

        cell3.addEventListener("click", function() 
        {
            cell3.style.backgroundColor = colorPicker.value;
        });

        cell3.addEventListener("dblclick", function() 
        {
            for (let i = 0; i < 6; i++) 
            {
                table.rows[i].cells[i].style.backgroundColor = colorPicker.value;
            }
        });
    </script>

</body>
